# ============================================================================
# Neardi LZ200 (RK3576) — 同框架第二块板，用于验证「加板不改脚本」
# dtb 取自 armbian csc: BOOT_FDT_FILE="rockchip/rk3576-neardi-lz200-linux.dtb"
# ============================================================================

BOARD_ID=neardi-lz200
MODEL="Neardi LZ200 (RK3576)"
FAMILY=rk3576

KERNEL_VER=6.1.172-vendor-rk35xx
KERNEL_BRANCH=vendor
DTB=rk3576-neardi-lz200-linux.dtb

PART_START_LBA=32768
BOOTLOADER_BYTES=16777216
CONSOLE=ttyS2,1500000n8

# 与 h96-m9 不同的 UUID / label：两块板做出来的镜像互不混淆
ROOT_UUID=6f3b2c1a-9d4e-4a71-8b25-1c7e5d9a0f43
ROOT_PARTUUID=1b46c7d4-f99a-4db0-a706-c887c6c67983
ROOT_LABEL=armbi_root
SLACK_PCT=12

CMA=256M
SELINUX=disabled

OE_VERSION=24.03-LTS-SP4
OE_BASE=https://dl-cdn.openeuler.openatom.cn
OE_QCOW_XZ=openEuler-${OE_VERSION}-aarch64.qcow2.xz

IMG_PREFIX=openEuler-${OE_VERSION}-${BOARD_ID}-${KERNEL_VER%%-*}
BOOT_ASSETS_TAG=boot-${BOARD_ID}-${KERNEL_VER%%-*}
