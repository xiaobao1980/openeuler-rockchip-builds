# ============================================================================
# Rock 5 ITX (Radxa, RK3588) — openEuler 用户态 + Armbian vendor 内核
# 本文件被 scripts/*.sh 与 workflow 共同 source，改这里就够，别去改脚本。
#
# 来源：boards/boards.tsv 同步自 armbian/build@5919204 的 rock-5-itx。
# 手写固化目的：UUID/DTB/CMA 不随上游 sync 变动，产物可复现。
# 首次构建前置：需先发布 boot 资产 boot-rock-5-itx-6.1.172（见文末）。
# ============================================================================

BOARD_ID=rock-5-itx
MODEL="Rock 5 ITX (RK3588)"
FAMILY=rk3588                  # rk3566 / rk3568 / rk3576 / rk3588 —— 仅用于分组

# --- 内核（Armbian rk35xx vendor 分支，全 RK35xx 共用一支）-----------------
KERNEL_VER=6.1.172-vendor-rk35xx
KERNEL_BRANCH=vendor
# DTB 取自 armbian/build config/boards/rock-5-itx.csc 的 BOOT_FDT_FILE
DTB=rk3588-rock-5-itx.dtb

# --- 引导：rockchip 通用布局，构建时以 bootloader 自带 GPT 为准 -------------
PART_START_LBA=32768
BOOTLOADER_BYTES=16777216
CONSOLE=ttyS2,1500000n8

# --- 文件系统 -------------------------------------------------------------
# 由 board-resolve.sh 的确定性 salt 派生后固化；与 TSV 自动推导值一致，
# 但手写后不再随上游清单变动。ROOT_UUID 给 fstab（用户态 blkid），
# ROOT_PARTUUID 给内核 cmdline 的 root=PARTUUID=（无 initrd，坑 #19）。
ROOT_UUID=ecbb1977-2bc0-4eab-aba8-feb203a51818
ROOT_PARTUUID=70214737-c35a-4d1c-afb4-9f4788d2675e
ROOT_LABEL=armbi_root
SLACK_PCT=12

# --- 内核 cmdline ---------------------------------------------------------
# RK3588 的 4K/8K VPU 解码与桌面合成建议 512M（与 board-resolve 的 rk3588 档一致）
CMA=512M
SELINUX=disabled

# --- openEuler ------------------------------------------------------------
OE_VERSION=24.03-LTS-SP4
OE_BASE=https://dl-cdn.openeuler.openatom.cn
OE_QCOW_XZ=openEuler-${OE_VERSION}-aarch64.qcow2.xz

IMG_PREFIX=openEuler-${OE_VERSION}-${BOARD_ID}-${KERNEL_VER%%-*}
BOOT_ASSETS_TAG=boot-${BOARD_ID}-${KERNEL_VER%%-*}
