# ============================================================================
# H96 MAX M9 (RK3576) — openEuler 用户态 + Armbian vendor 内核
# 本文件被 scripts/*.sh 与 workflow 共同 source，改这里就够，别去改脚本。
# ============================================================================

# 板卡目录名 = 产物 board id = h96-m9。
# 注意：armbian-custom-builds 里那个目录叫 h96s（只是区分 "golden 基线" 文件集），
# 但产物 board id 同样是 h96-m9 —— 同一台机器，本仓库不再保留 h96s 这个别名。
BOARD_ID=h96-m9
MODEL="H96 MAX M9 (RK3576)"
FAMILY=rk3576                  # rk3566 / rk3568 / rk3576 / rk3588 —— 仅用于分组

# --- 内核（来自 Armbian rk35xx vendor 分支，含 rkmpp / HT5010 音频）----------
# 全系列共用一支内核：linux-rockchip rk-6.1-rkr7.2 同时覆盖 3566/3568/3576/3588，
# 所以 KERNEL_VER 在 RK35xx 各板上是同一个字符串。
KERNEL_VER=6.1.172-vendor-rk35xx
KERNEL_BRANCH=vendor
DTB=rk3576-h96-m9s.dtb

# --- 引导 ----------------------------------------------------------------
# Armbian rockchip 系列 GPT 第一个分区固定从 LBA 32768 (16 MiB) 开始；
# 前 16 MiB 是 MBR + GPT + idbloader + u-boot.itb，构建时逐字节保留。
# 构建脚本会从 bootloader 区自带的 GPT 读出真实值并校验，这里只是兜底默认。
PART_START_LBA=32768
BOOTLOADER_BYTES=16777216
# 暂不改动：两轮真机的内核日志都正常输出，说明 console 不是阻断项。
# 但板上实测 `printk: console [ttyFIQ0] enabled` / `Registered fiq debugger
# ttyFIQ0`，8250 只注册 ttyS4/ttyS5 —— 这支 vendor 内核没有 ttyS2，输出其实是
# 靠 fiq_debugger 自己注册 console 兜住的。**进系统后若串口没有登录提示符**，
# 执行 systemctl enable --now serial-getty@ttyFIQ0.service（详见 README 坑 #19）。
# 不在这里直接改 cmdline：baud 参数解析一旦有偏差，下一轮会连日志都看不到。
CONSOLE=ttyS2,1500000n8

# --- 文件系统 -------------------------------------------------------------
# 复用 Armbian 原镜像的 rootfs UUID：升级/换卡时 fstab 都不断裂，
# 且构建可复现（不依赖每次随机生成）。
# 注意：这是**文件系统 UUID**，只能用于 fstab（用户态 blkid 解析），
# 不能当内核 cmdline 的 root=UUID= —— 我们不装 initrd，内核不认这个前缀（坑 #19）。
ROOT_UUID=5719bdd4-781b-463e-b7b7-7ba8f80fa330
# GPT 分区项 1 的 UniquePartitionGUID，内核 cmdline 用 root=PARTUUID= 读它。
# 由 board id 确定性派生（见 board-resolve.sh 的 partuuid salt），固定后产物可复现。
ROOT_PARTUUID=78ec7a30-e1b3-4d21-a228-e60e3b63dcee
ROOT_LABEL=armbi_root
# 分区 = 内容 + 该比例余量，mkfs 直接按分区大小格式化 → 首启无需 resize2fs
SLACK_PCT=12

# --- 内核 cmdline 追加项 ---------------------------------------------------
# RK3576 的 dts 没有 linux,cma 节点，vendor 默认 32M 会让 HDMI 黑屏/掉帧。
# 512M 来自板上实证：boot 资产里的 armbianEnv.txt 写 extraboardargs=cma=512M，
# armbian-custom-builds 的 h96-m9.csc 第 149 行也说明 4K60 VPU 解码缓冲需 ≥512M
# （8GB 板推荐值；2GB 板才降 128M）。第二轮真机日志显示我们曾只给 256M。
CMA=512M
# openEuler 默认 enforcing，首次 bring-up 必须关；跑通后再谈策略
SELINUX=disabled

# --- openEuler ------------------------------------------------------------
OE_VERSION=24.03-LTS-SP4
# 官方整机镜像（不是 docker_img：后者缺 sshd/NetworkManager/firewalld/selinux-policy）
OE_BASE=https://dl-cdn.openeuler.openatom.cn
OE_QCOW_XZ=openEuler-${OE_VERSION}-aarch64.qcow2.xz

# 产物命名
IMG_PREFIX=openEuler-${OE_VERSION}-${BOARD_ID}-${KERNEL_VER%%-*}

# boot 资产在 Release 里的 tag（publish-boot-assets.yml 产出，build 时消费）
BOOT_ASSETS_TAG=boot-${BOARD_ID}-${KERNEL_VER%%-*}
